name: Build Installers

# Builds the Windows NSIS installer and attaches it to a GitHub RELEASE
# named after the package.json version (v<version>). Release assets do NOT
# count against the Actions artifact-storage quota. Runs ONLY on a version
# tag push or on demand — never on ordinary branch pushes.
#
# This Skylcodes fork ships Windows only (the user's install-over target).
# Linux/mac matrix jobs from upstream were dropped so a missing mac runner
# cannot leave a half-published release.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write   # create the release + upload assets

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The release step below names the release after package.json, not the
      # tag. Refuse a mismatched tag before spending a Windows build on it.
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($want). Bump package.json or re-tag."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Must stay on a standard (GIL) CPython — free-threaded wheels
          # (abi3t / python3t.dll) break the frozen backend selftest on Windows.
          python-version: '3.11'
          architecture: 'x64'

      - name: Confirm build Python (not free-threaded)
        shell: bash
        run: |
          python -c "import sys,sysconfig; print(sys.version); assert not (sysconfig.get_config_var('Py_GIL_DISABLED') or 0)"
          # Prefer PATH `python` over the Windows `py -3` launcher in build scripts.
          which python
          python -c "import sys; print(sys.executable)"

      - name: Install Node dependencies
        run: npm ci

      - name: Build app, bundle backend, package installer
        run: npm run dist
        env:
          # No code-signing cert in this fork — Windows SmartScreen will warn
          # until a cert is added. Do not auto-discover a machine identity.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Attach installers to release v${{ steps.ver.outputs.version }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Krypt Trader v${{ steps.ver.outputs.version }}
          body: |
            Skylcodes fork of Krypt Trader 6.4.0 with excluded-markets filter.

            - **appId / productName unchanged** (`cc.krypt.trader` / `Krypt Trader`) so installing over an existing install keeps settings, API keys and local data.
            - **No auto-updater**: upstream never shipped `electron-updater`; this build also points `repository` at Skylcodes/krypt-trader so nothing can try the deleted scripflipped upstream.
            - **Unsigned Windows build**: expect a SmartScreen / "Windows protected your PC" prompt on first run until a code-signing certificate is configured.
          overwrite_files: true
          files: |
            release/*.exe
            release/*.blockmap
