name: Build Installers

# Builds native installers and attaches them to a GitHub RELEASE named after
# package.json (v<version>). Release assets do NOT count against Actions
# artifact storage. Runs ONLY on a version tag push or on demand.
#
# Matrix notes:
# - Windows NSIS on windows-latest.
# - macOS arm64 on macos-latest; macOS x64 on macos-15-intel.
#   PyInstaller freezes the host Python, so each mac job produces a native
#   backend for that arch (not a lipo universal binary). Both DMGs/ZIPs land
#   on the same release so Apple Silicon and Intel Macs are covered.
# - Ad-hoc codesign via scripts/mac-adhoc-sign.cjs (afterPack). No Apple
#   Developer cert / notarization.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write   # create the release + upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: mac-apple-silicon   # arm64 .dmg + .zip
          - os: macos-15-intel
            name: mac-intel           # x64 .dmg + .zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($want). Bump package.json or re-tag."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Standard (GIL) CPython only — free-threaded abi3t wheels break the
          # frozen backend selftest on Windows and are not used for mac either.
          python-version: '3.11'
          architecture: 'x64'

      - name: Confirm build Python (not free-threaded)
        shell: bash
        run: |
          python -c "import sys,sysconfig,platform; print(sys.version); print('machine=', platform.machine()); assert not (sysconfig.get_config_var('Py_GIL_DISABLED') or 0)"
          which python
          python -c "import sys; print(sys.executable)"

      - name: Install Node dependencies
        run: npm ci

      - name: Build app, bundle backend, package installer
        run: npm run dist
        env:
          # No Developer ID / Windows Authenticode cert in this fork.
          # afterPack (mac-adhoc-sign.cjs) applies an ad-hoc seal on macOS so
          # Apple Silicon does not refuse the bundle as "damaged".
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify macOS ad-hoc signature
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          APP=$(ls -d release/mac*/*.app | head -1)
          echo "Verifying $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          file "$APP/Contents/MacOS/"* || true
          file "$APP/Contents/Resources/python/krypt-trader-backend" \
            || file "$APP/Contents/Resources/python/"* | head -20

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Attach installers to release v${{ steps.ver.outputs.version }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Krypt Trader v${{ steps.ver.outputs.version }}
          body: |
            Skylcodes fork of Krypt Trader 6.4.0 with excluded-markets filter.

            - **appId / productName unchanged** (`cc.krypt.trader` / `Krypt Trader`) so installing over an existing install keeps settings, API keys and local data.
            - **No auto-updater**: upstream never shipped `electron-updater`; repo metadata points at Skylcodes/krypt-trader.
            - **Windows**: unsigned NSIS installer — expect SmartScreen on first run.
            - **macOS**: separate **arm64** (Apple Silicon) and **x64** (Intel) DMGs/ZIPs. Each bundles a native Python backend (PyInstaller). Ad-hoc signed, **not notarized**.

            ### First open on macOS
            1. Download the DMG matching your chip (`arm64` for M1/M2/M3/M4, `x64` for Intel).
            2. Open the DMG, drag **Krypt Trader** to Applications.
            3. First launch: **right-click → Open** (or System Settings → Privacy & Security → Open Anyway). Gatekeeper blocks unsigned/ad-hoc apps until you approve once.
            4. If macOS still says the app is damaged: `xattr -cr "/Applications/Krypt Trader.app"` then right-click → Open again.
          overwrite_files: true
          files: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.blockmap
            release/*.dmg
            release/*.zip
